name: Update data & deploy

on:
  schedule:
    # Learning Centre issue + email. GitHub's timed runs are best-effort and often late or
    # skipped (especially on the hour), so there are several morning attempts; the email is
    # only ever sent once per issue, and the page itself switches issue at 06:00 UK time.
    - cron: "7 5 * * *"
    - cron: "11 6 * * *"
    - cron: "41 6 * * *"
    - cron: "23 8 * * *"
    # Weekdays, UTC: after UK 07:00 releases, after US 08:30/10:00 ET releases, and end of day.
    - cron: "30 7 * * 1-5"
    - cron: "15 15 * * 1-5"
    - cron: "0 22 * * 1-5"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -m pipeline.build

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data site/feed.xml data_cache
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update data $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: Version asset URLs (so browsers never mix old and new files)
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" site/index.html site/app.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  newsletter:
    # After the site is live, so links in the email work. Sends at most once per issue.
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Send today's Learning Centre email
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: python -m pipeline.newsletter
      - name: Record what was sent
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data_cache/newsletter.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Nothing to record"; else
            git commit -m "Record newsletter send $(date -u +%Y-%m-%d)"
            git pull --rebase -X theirs && git push
          fi
