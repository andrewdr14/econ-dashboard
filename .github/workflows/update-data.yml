name: Update data & deploy

on:
  schedule:
    # Weekdays, UTC: after UK 07:00 releases, after US 08:30/10:00 ET releases, and end of day.
    - cron: "30 7 * * 1-5"
    - cron: "15 15 * * 1-5"
    - cron: "0 22 * * 1-5"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -m pipeline.build

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data data_cache
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update data $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: Version asset URLs (so browsers never mix old and new files)
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" site/index.html site/app.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
